<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Portal — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Client Portal</span>
    <span class="text-light">Signed in as {{ user }} ({{ role }}) · <a href="/logout" class="text-light">Logout</a></span>
  </nav>
  <div class="container mt-4" style="max-width: 720px;">
    <h4 class="mb-4">Welcome, {{ user }}</h4>

    <div class="card mb-4 shadow-sm">
      <div class="card-header">Upload a document</div>
      <div class="card-body">
        {% if upload_msg %}<div class="alert alert-info py-2">{{ upload_msg }}</div>{% endif %}
        <form method="POST" action="/upload" enctype="multipart/form-data">
          <div class="input-group">
            <input type="file" name="file" class="form-control" required>
            <button class="btn btn-primary" type="submit">Upload</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header">Network diagnostics — ping a host</div>
      <div class="card-body">
        <form method="POST" action="/ping">
          <div class="input-group">
            <input type="text" name="host" class="form-control" placeholder="e.g. 8.8.8.8" required>
            <button class="btn btn-secondary" type="submit">Ping</button>
          </div>
        </form>
        {% if ping_output %}<pre class="mt-3 bg-dark text-light p-3 rounded">{{ ping_output }}</pre>{% endif %}
      </div>
    </div>
  </div>
</body>
</html>
